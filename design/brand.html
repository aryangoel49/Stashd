<!doctype html>
<!-- Stashd icon, live. Springs from Motion (motion.dev). Open in a browser; click the icon or the buttons. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stashd Brand</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --text: #111114;
        --muted: rgba(17, 17, 20, 0.55);
        --chip: rgba(17, 17, 20, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0a0a0c;
          --text: #ffffff;
          --muted: rgba(255, 255, 255, 0.55);
          --chip: rgba(255, 255, 255, 0.08);
        }
      }
      :root[data-theme='dark'] {
        --bg: #0a0a0c;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.55);
        --chip: rgba(255, 255, 255, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif;
        padding: 16px;
      }
      main { display: grid; justify-items: center; gap: 28px; text-align: center; }
      /* 1u = 1/1024 of the canvas, same geometry as assets/brand/stashd-icon.svg */
      .icon { --u: calc(min(300px, 78vw) / 1024); position: relative; width: calc(1024 * var(--u)); aspect-ratio: 1; cursor: pointer; }
      .tile {
        position: absolute; inset: calc(100 * var(--u)); border-radius: calc(186 * var(--u)); overflow: hidden;
        background: linear-gradient(#26262c, #0c0c0f);
        box-shadow: inset 0 0 0 calc(3 * var(--u)) rgba(255, 255, 255, 0.1), 0 calc(30 * var(--u)) calc(80 * var(--u)) rgba(0, 0, 0, 0.25);
      }
      .block { position: absolute; height: calc(164 * var(--u)); width: calc(336 * var(--u)); background: #fff; }
      /* Positions are relative to the tile, which starts at 100u. */
      .top { left: calc(274 * var(--u)); top: calc(236 * var(--u)); border-radius: calc(82 * var(--u)) 0 0 calc(82 * var(--u)); }
      .bot { left: calc(214 * var(--u)); top: calc(424 * var(--u)); border-radius: 0 calc(82 * var(--u)) calc(82 * var(--u)) 0; }
      h1 { margin: 0; font-size: 52px; font-weight: 650; letter-spacing: -1.8px; line-height: 1; }
      p { margin: 6px 0 0; color: var(--muted); }
      .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      button {
        font: inherit; font-weight: 600; color: var(--text); background: var(--chip);
        border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
      }
      kbd { font: inherit; opacity: 0.55; margin-left: 6px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" id="icon" role="img" aria-label="Stashd icon">
        <div class="tile">
          <div class="block top" id="top"></div>
          <div class="block bot" id="bot"></div>
        </div>
      </div>
      <div>
        <h1>Stashd</h1>
        <p>Put your work away. Pick it up right where you left off.</p>
      </div>
      <div class="buttons">
        <button id="stash">Stash<kbd>⇧⌘S</kbd></button>
        <button id="pickup">Pick up<kbd>⇧⌘W</kbd></button>
      </div>
    </main>

    <script type="module">
      import { animate } from 'https://cdn.jsdelivr.net/npm/motion@12.23.12/+esm';

      const top = document.getElementById('top');
      const bot = document.getElementById('bot');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const spring = reduced ? { duration: 0 } : { type: 'spring', stiffness: 320, damping: 26 };
      let stashed = false;

      // Stash: the two blocks slide in from opposite sides and lock into the S.
      async function stash() {
        stashed = true;
        animate(top, { x: ['120%', '0%'], opacity: [0, 1] }, spring);
        await animate(bot, { x: ['-120%', '0%'], opacity: [0, 1] }, { ...spring, delay: reduced ? 0 : 0.08 });
      }

      // Pick up: they slide back out the way they came.
      async function pickUp() {
        stashed = false;
        animate(top, { x: '120%', opacity: 0 }, spring);
        await animate(bot, { x: '-120%', opacity: 0 }, spring);
      }

      document.getElementById('stash').onclick = () => !stashed && stash();
      document.getElementById('pickup').onclick = () => stashed && pickUp();
      document.getElementById('icon').onclick = () => (stashed ? pickUp().then(stash) : stash());
      stash();
    </script>
  </body>
</html>
