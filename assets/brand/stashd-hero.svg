<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Stashd: put your work away, pick it up where you left off">
  <style>
    .drop { animation: drop 5.2s cubic-bezier(.3,.7,.4,1) infinite; }
    .tray { animation: squash 5.2s ease-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .glow { animation: pulse 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes drop {
      0%   { transform: translateY(-600px); opacity: 0; }
      8%   { transform: translateY(-600px); opacity: 1; }
      30%  { transform: translateY(14px); }
      38%  { transform: translateY(-8px); }
      45%  { transform: translateY(0); }
      82%  { transform: translateY(0); opacity: 1; }
      94%  { transform: translateY(-160px); opacity: 0; }
      100% { transform: translateY(-600px); opacity: 0; }
    }
    @keyframes squash {
      0%, 28% { transform: scale(1, 1); }
      32%     { transform: scale(1.04, .93); }
      40%     { transform: scale(.99, 1.02); }
      46%, 100% { transform: scale(1, 1); }
    }
    @keyframes pulse {
      0%, 25%  { opacity: .55; transform: scale(1); }
      35%      { opacity: .9; transform: scale(1.08); }
      60%, 100% { opacity: .55; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .drop, .tray, .glow { animation: none; } }
    .title { font: 700 104px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif; letter-spacing: -3px; }
    .tag { font: 500 30px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif; }
    .key { font: 600 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1C36"/>
      <stop offset="1" stop-color="#0E0F1F"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#6C75E6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6C75E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6C75E6"/>
      <stop offset="1" stop-color="#434AB8"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle class="glow" cx="230" cy="210" r="230" fill="url(#halo)"/>

  <!-- the icon, drawn in its own 1024 space -->
  <g transform="translate(70 50) scale(0.3125)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
    <g clip-path="url(#sq)">
      <g class="drop">
        <rect x="402" y="331" width="220" height="300" rx="44" fill="#FFC56B" transform="rotate(-9 512 481)"/>
      </g>
    </g>
    <path class="tray" d="M292 500V628a92 92 0 0 0 92 92H640a92 92 0 0 0 92-92V500" fill="none" stroke="#FFFAEF" stroke-width="68" stroke-linecap="round"/>
  </g>

  <text class="title" x="460" y="200" fill="#FFFAEF">Stashd</text>
  <text class="tag" x="464" y="252" fill="#B9BCE0">Put your work away. Pick it up right where you left off.</text>

  <g transform="translate(464 296)">
    <rect width="96" height="44" rx="10" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text class="key" x="48" y="30" text-anchor="middle" fill="#FFFAEF">⇧⌘S</text>
    <text class="key" x="112" y="30" fill="#8C90BE">stash</text>
    <rect x="200" width="100" height="44" rx="10" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text class="key" x="250" y="30" text-anchor="middle" fill="#FFFAEF">⇧⌘W</text>
    <text class="key" x="316" y="30" fill="#8C90BE">pick up</text>
    <circle cx="436" cy="22" r="5" fill="#FFC56B"/>
    <text class="key" x="452" y="30" fill="#8C90BE">stays on your Mac</text>
  </g>
</svg>
