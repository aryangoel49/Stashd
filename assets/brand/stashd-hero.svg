<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Stashd: put your work away, pick it up where you left off">
  <style>
    .top { animation: top 6s cubic-bezier(.2,.8,.2,1) infinite; }
    .bot { animation: bot 6s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes top {
      0%   { transform: translateX(260px); opacity: 0; }
      14%  { transform: translateX(0); opacity: 1; }
      84%  { transform: translateX(0); opacity: 1; }
      96%, 100% { transform: translateX(260px); opacity: 0; }
    }
    @keyframes bot {
      0%, 6% { transform: translateX(-260px); opacity: 0; }
      20%  { transform: translateX(0); opacity: 1; }
      80%  { transform: translateX(0); opacity: 1; }
      92%, 100% { transform: translateX(-260px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .top, .bot { animation: none; } }
    .title { font: 650 96px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif; letter-spacing: -3.5px; }
    .tag { font: 400 28px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif; letter-spacing: -.2px; }
    .key { font: 500 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif; }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A31"/>
      <stop offset="1" stop-color="#0C0C0F"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect width="1280" height="360" rx="24" fill="#0A0A0C"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <g transform="translate(64 20) scale(0.3125)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="3"/>
    <g clip-path="url(#sq)">
      <path class="top" d="M456 336H710V500H456a82 82 0 0 1 0-164z" fill="#FFFFFF"/>
      <path class="bot" d="M314 524H568a82 82 0 0 1 0 164H314z" fill="#FFFFFF"/>
    </g>
  </g>

  <text class="title" x="440" y="178" fill="#FFFFFF">Stashd</text>
  <text class="tag" x="444" y="226" fill="#9A9AA3">Put your work away. Pick it up right where you left off.</text>
  <g transform="translate(444 258)" class="key">
    <rect width="82" height="38" rx="9" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="41" y="26" text-anchor="middle" fill="#FFFFFF">⇧⌘S</text>
    <text x="96" y="26" fill="#6E6E78">stash</text>
    <rect x="176" width="86" height="38" rx="9" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="219" y="26" text-anchor="middle" fill="#FFFFFF">⇧⌘W</text>
    <text x="276" y="26" fill="#6E6E78">pick up</text>
    <text x="380" y="26" fill="#6E6E78">·  local-first, menu bar, macOS</text>
  </g>
</svg>
