# A check that Stashd builds on a clean Mac, for both chips. It does NOT publish releases.
# Releases are built and published from Aryan's Mac (see CLAUDE.md), because only that Mac has the
# "Stashd Local Signing" certificate: builds made here have no certificate, so the updater would refuse
# them and anyone installing one would have to approve Stashd's permissions again.
# (Later: put the certificate in this repo's secrets, sign here, and publish from here again. See PLAN.md.)
# Run it by hand: Actions → Build check → Run workflow. The DMGs it keeps are for testing only.
name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm test

      - name: Build DMG and zip
        run: |
          npm run make
          npm run make:intel

      - name: Helper runs on both chips and macOS 13
        run: |
          lipo native/build/wwi-helper -verify_arch arm64 x86_64
          [ "$(vtool -show-build native/build/wwi-helper | grep -c 'minos 13.0')" = 2 ] || (echo "wwi-helper is not built for macOS 13" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: Stashd-unsigned-test-build-${{ github.sha }}
          path: |
            out/make/dmg/arm64/Stashd.dmg
            out/make/zip/darwin/arm64/*.zip
            out/make/dmg/x64/Stashd-Intel.dmg
            out/make/zip/darwin/x64/*.zip
          if-no-files-found: error

