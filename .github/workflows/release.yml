# Builds Stashd.dmg (Apple silicon) and Stashd-Intel.dmg on a Mac runner.
# - Run it by hand (Actions → Release → Run workflow) to get the DMG as a downloadable build artifact.
# - Push a tag like v1.0.1 (matching "version" in package.json) to also publish a GitHub Release with
#   the DMG and zip attached. The README links to releases/latest/download/Stashd.dmg.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm test

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($want)." && exit 1
          fi

      - name: Build DMG and zip
        run: |
          npm run make
          npm run make:intel

      - name: Helper runs on both chips and macOS 13
        run: |
          lipo native/build/wwi-helper -verify_arch arm64 x86_64
          [ "$(vtool -show-build native/build/wwi-helper | grep -c 'minos 13.0')" = 2 ] || (echo "wwi-helper is not built for macOS 13" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: Stashd-${{ github.ref_name }}
          path: |
            out/make/dmg/arm64/Stashd.dmg
            out/make/zip/darwin/arm64/*.zip
            out/make/dmg/x64/Stashd-Intel.dmg
            out/make/zip/darwin/x64/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/make/dmg/arm64/Stashd.dmg out/make/zip/darwin/arm64/*.zip out/make/dmg/x64/Stashd-Intel.dmg out/make/zip/darwin/x64/*.zip --title "Stashd $GITHUB_REF_NAME" --generate-notes
